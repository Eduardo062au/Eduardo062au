name: generate animation

on:
  # roda automaticamente uma vez por dia
  schedule:
    - cron: "0 0 * * *"

  # permite rodar manualmente a qualquer momento
  workflow_dispatch:

  # roda a cada push na branch principal
  push:
    branches:
      - main
      - master

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Checkout do repositório (necessário)
      - name: Checkout repository
        uses: actions/checkout@v4

      # Gera a animação da cobrinha (SVG)
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Faz push dos SVGs para a branch `output`
      - name: Push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}